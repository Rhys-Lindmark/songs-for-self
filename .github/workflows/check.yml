name: Check music app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_url:
        description: Optional existing site URL for live browser verification
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: music-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run data:music-map && git diff --exit-code --stat -- public/music-map.json
      - run: npm run data:acclaimed-albums && git diff --exit-code --stat -- public/acclaimed-albums.json
      - run: npm run data:reference-exploration && git diff --exit-code --stat -- data/reference-exploration.json public/reference-exploration.json
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify playlist and music map in desktop and mobile browsers
        env:
          SFS_BASE_URL: ${{ inputs.live_url || 'http://127.0.0.1:4329' }}
          SFS_REFERENCE_SCREENSHOT: ${{ runner.temp }}/reference-exploration.png
          SFS_PERF_OUTPUT: ${{ runner.temp }}/timeline-performance.json
          SFS_PERF_SCREENSHOT: ${{ runner.temp }}/timeline-performance.png
          SFS_HISTORY_SCREENSHOT: ${{ runner.temp }}/listening-history.png
          SFS_PROFILE_SCREENSHOT: ${{ runner.temp }}/genre-profile.png
          SFS_ACCLAIMED_SCREENSHOT: ${{ runner.temp }}/acclaimed-albums.png
          SFS_COVERAGE_SCREENSHOT: ${{ runner.temp }}/music-coverage.png
        run: |
          if [ "$SFS_BASE_URL" = "http://127.0.0.1:4329" ]; then
            npm run start -- --port 4329 --ip 127.0.0.1 --compatibility-date 2026-05-22 > "$RUNNER_TEMP/music-preview.log" 2>&1 &
            preview_pid=$!
            trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
            for attempt in {1..60}; do
              if curl -fsS "$SFS_BASE_URL" > /dev/null; then break; fi
              sleep 1
            done
            curl -fsS "$SFS_BASE_URL" > /dev/null
          fi
          npm run test:reference-exploration-browser
          npm run test:timeline-performance-browser
          npm run test:listening-history-browser
          npm run test:spotify-account-data-browser
          npm run test:genre-profile-browser
          npm run test:acclaimed-albums-browser
          npm run test:music-coverage-browser
          npm run test:album-explorer-browser
          npm run test:responsive
          npm run test:accessibility
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: music-browser-evidence
          path: |
            ${{ runner.temp }}/reference-exploration.png
            ${{ runner.temp }}/timeline-performance.json
            ${{ runner.temp }}/timeline-performance.png
            ${{ runner.temp }}/listening-history.png
            ${{ runner.temp }}/genre-profile.png
            ${{ runner.temp }}/acclaimed-albums.png
            ${{ runner.temp }}/music-coverage.png
            ${{ runner.temp }}/music-preview.log
          if-no-files-found: ignore
          retention-days: 7
